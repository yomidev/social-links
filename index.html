<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Links</title>
    <link
      rel="shortcut icon"
      href="images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="images/avatar-jessica.jpeg" alt="" class="avatar" />
        <h1 class="name">Jessica Randall</h1>
        <p class="text-green">London, United Kingdom</p>
      </header>
      <p class="subtitle">"Front-end developer and avid reader"</p>
      <section class="buttons">
        <a href="https://github.com" target="_blank" class="btn-link">GitHub</a>
        <a href="https://frontendmentor.com" target="_blank" class="btn-link"
          >Frontend Mentor</a
        >
        <a href="https://linkedin.com" target="_blank" class="btn-link"
          >Linkedin</a
        >
        <a href="https://x.com" target="_blank" class="btn-link">Twitter</a>
        <a href="https://instagram.com" target="_blank" class="btn-link"
          >Instagram</a
        >
      </section>
      <!--Comentario-->
    </main>
  </body>
</html>
